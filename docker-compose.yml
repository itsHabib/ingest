services:
  kafka:
    image: apache/kafka:latest
    container_name: ingest-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft mode (built-in, no Zookeeper)
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners: EXTERNAL for host, INTERNAL for containers
      KAFKA_LISTENERS: "EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # Defaults
      KAFKA_NUM_PARTITIONS: "6"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - kafka-data:/var/lib/kafka/data

  redpanda-console:
    image: redpandadata/console:latest
    container_name: ingest-console
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      kafka:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: ingest-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - minio-data:/data

  gateway:
    build: .
    container_name: ingest-gateway
    command: ["gateway"]
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9100:9100"
    environment:
      INGEST_KAFKA_BROKERS: "kafka:29092"
      INGEST_GATEWAY_RATE_LIMIT_RATE: "1000"
      INGEST_GATEWAY_RATE_LIMIT_BURST: "5000"
    depends_on:
      kafka:
        condition: service_healthy

  ingester:
    build: .
    container_name: ingest-ingester
    command: ["ingester"]
    ports:
      - "127.0.0.1:9101:9101"
    environment:
      INGEST_KAFKA_BROKERS: "kafka:29092"
      INGEST_STORAGE_BACKEND: "s3"
      INGEST_S3_ENDPOINT: "http://minio:9000"
      INGEST_S3_BUCKET: "ingestion-engine"
      INGEST_S3_ACCESS_KEY: "minioadmin"
      INGEST_S3_SECRET_KEY: "minioadmin"
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  querier:
    build: .
    container_name: ingest-querier
    command: ["querier"]
    ports:
      - "127.0.0.1:8083:8082"
      - "127.0.0.1:9102:9102"
    environment:
      INGEST_STORAGE_BACKEND: "s3"
      INGEST_S3_ENDPOINT: "http://minio:9000"
      INGEST_S3_BUCKET: "ingestion-engine"
      INGEST_S3_ACCESS_KEY: "minioadmin"
      INGEST_S3_SECRET_KEY: "minioadmin"
    depends_on:
      minio:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: ingest-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - gateway
      - ingester
      - querier

  grafana:
    image: grafana/grafana:latest
    container_name: ingest-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  kafka-data:
  minio-data:
  prometheus-data:
  grafana-data:
